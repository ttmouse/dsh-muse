# Live-model counterpart to muse.cordis.snapshot.yml: the same goal family plus
# Muse autonomy, driven by the real DeepSeek adapter. Requires DEEPSEEK_API_KEY
# through the credential store.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: goal
            name: '@deepseek-ai/dsh-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: goal-round-driver
            name: '@deepseek-ai/dsh-goal-round-driver'
          - id: muse
            name: '@deepseek-ai/dsh-muse'
          - id: tool-muse
            name: '@deepseek-ai/dsh-tool-muse'
