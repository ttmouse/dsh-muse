# Goal family + Muse autonomy bundle example: add these five entries to your
# profile's bundle list (goal family first, muse last). Model credentials go
# through the DSH credential store.
- id: base
  name: '@deepseek-ai/cordis-plugin-include'
  config:
    path: ./cordis.yml
    patches:
      - insert:
          - id: goal
            name: '@deepseek-ai/dsh-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          - id: goal-round-driver
            name: '@deepseek-ai/dsh-goal-round-driver'
          - id: muse
            name: '@deepseek-ai/dsh-muse'
          - id: tool-muse
            name: '@deepseek-ai/dsh-tool-muse'
